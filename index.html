<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0F14">
<title>家族カレンダー</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg0:#0D0F14;--bg1:#141720;--bg2:#1C2030;--bg3:#252A3A;
  --border:#2E3448;--border2:#3A4060;
  --accent:#7C6EFA;--accent2:#9D92FB;
  --text0:#F0F2FF;--text1:#BEC5DC;--text2:#6B748E;--text3:#3D4460;
  --r:10px;
  --cal-margin:14px;--cell-h:64px;
  --hdr-pad:14px 18px 10px;--panel-pad:12px 14px;--ev-pad:9px 14px;
  --font-month:17px;--font-title:16px;--font-ev:14px;--font-meta:11px;
  --av-ev:36px;--bni-ic:20px;
}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--text0);width:100%;max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom));}
.serif{font-family:'DM Serif Display',serif;}
.pin-screen{position:fixed;inset:0;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
.pin-logo{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text0);margin-bottom:6px;}
.pin-sub{font-size:13px;color:var(--text2);margin-bottom:40px;}
.pin-dots{display:flex;gap:16px;margin-bottom:36px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-dot.error{background:#F47272;border-color:#F47272;}
.pin-error{font-size:13px;color:#F47272;margin-bottom:16px;min-height:20px;text-align:center;}
.pin-locked{font-size:13px;color:#F47272;text-align:center;padding:0 24px;line-height:1.6;}
.pin-timer{font-size:22px;font-weight:700;color:#F47272;margin-top:8px;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:260px;}
.pin-key{height:70px;border-radius:16px;background:var(--bg2);border:1px solid var(--border);font-size:24px;font-weight:500;color:var(--text0);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;font-family:'Outfit',sans-serif;user-select:none;}
.pin-key:active{background:var(--bg3);transform:scale(.95);}
.pin-key.del{font-size:18px;color:var(--text2);}
.pin-key.empty{background:transparent;border:none;cursor:default;}
.pin-key.empty:active{transform:none;}
.hdr{background:var(--bg1);padding:var(--hdr-pad);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.app-name{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
.app-badge{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);margin-left:4px;transition:background .3s;}
.sync-dot.ok{background:#34D399;}.sync-dot.err{background:#F47272;}
.sync-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.hdr-right{display:flex;align-items:center;gap:6px;}
.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;}
.icon-btn:active{background:var(--bg3);}
.badge-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#F47272;border:2px solid var(--bg1);display:none;}
.badge-dot.show{display:block;}
.view-toggle{display:flex;gap:3px;background:var(--bg2);border-radius:8px;padding:3px;border:1px solid var(--border);}
.vt-btn{padding:4px 10px;border-radius:5px;border:none;background:transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s;}
.vt-btn.on{background:var(--bg3);color:var(--text0);}
.hdr-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.month-nav{display:flex;align-items:center;gap:8px;}
.month-lbl{font-family:'DM Serif Display',serif;font-size:var(--font-month);min-width:110px;text-align:center;}
.nav-btn{width:30px;height:30px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text1);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-btn:active{background:var(--bg3);}
.today-btn{padding:5px 12px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--accent2);font-size:11px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;}
.today-btn:active{background:var(--bg3);}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;}
.chips::-webkit-scrollbar{display:none;}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);white-space:nowrap;font-family:'Outfit',sans-serif;}
.chip.on{border-color:currentColor;color:inherit;}
.chip-av{width:18px;height:18px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;}
.chip-av img{width:100%;height:100%;object-fit:cover;}
.cal-wrap{background:var(--bg1);margin:12px var(--cal-margin) 0;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2);border-bottom:1px solid var(--border);}
.dow-cell{text-align:center;padding:7px 2px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;}
.dow-cell:first-child{color:#F47272;}.dow-cell:last-child{color:#6090D0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day{min-height:var(--cell-h);padding:4px 3px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.day:nth-child(7n){border-right:none;}.day:active{background:var(--bg3);}
.day.other .dn{color:var(--text3);}.day.sel{background:var(--bg3);}
.day.sel .dn{background:var(--accent);color:#fff;border-radius:50%;}
.day.tod .dn{background:rgba(124,110,250,.22);color:var(--accent2);border-radius:50%;}
.day.tod.sel .dn{background:var(--accent);color:#fff;}
.dn{font-family:'DM Serif Display',serif;font-size:14px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:0 auto 2px;color:var(--text1);}
.day.sun .dn{color:#F47272;}.day.sat .dn{color:#6090D0;}
.av-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:0 2px;}
.av-sm{width:14px;height:14px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;}
.av-sm img{width:100%;height:100%;object-fit:cover;}
.more-dot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--text2);font-weight:600;}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.week-day{min-height:100px;padding:5px 3px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;}
.week-day:last-child{border-right:none;}
.week-ev{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;border-left:2px solid transparent;}
.day-panel{background:var(--bg1);margin:12px var(--cal-margin) 0;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;}
.dp-hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--panel-pad);border-bottom:1px solid var(--border);}
.dp-title{font-family:'DM Serif Display',serif;font-size:var(--font-title);}
.add-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--accent);border:none;border-radius:8px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;}
.add-btn:active{opacity:.8;}
.ev-list{padding:6px 0;min-height:56px;}
.ev-item{display:flex;align-items:center;gap:10px;padding:var(--ev-pad);cursor:pointer;border-left:3px solid transparent;transition:background .1s;}
.ev-item:active{background:var(--bg2);}
.ev-av{width:var(--av-ev);height:var(--av-ev);border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ev-av img{width:100%;height:100%;object-fit:cover;}
.ev-info{flex:1;min-width:0;}
.ev-title{font-size:var(--font-ev);font-weight:500;margin-bottom:2px;}
.ev-meta{font-size:var(--font-meta);color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.ev-label-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ev-actions{display:flex;gap:2px;flex-shrink:0;}
.ev-edit,.ev-del{padding:6px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;border-radius:6px;}
.ev-edit:active{background:var(--bg3);color:var(--accent2);}
.ev-del:active{background:#3A1A1A;color:#F09595;}
.empty{padding:22px;text-align:center;font-size:13px;color:var(--text3);}
.toast{background:var(--bg3);border:1px solid var(--border2);color:var(--text0);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;text-align:center;margin:8px var(--cal-margin) 0;pointer-events:none;}
.toast.show{opacity:1;}
.bnav{background:var(--bg1);border-top:1px solid var(--border);display:flex;padding-top:6px;padding-bottom:max(12px,env(safe-area-inset-bottom));position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;z-index:50;}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;border:none;background:none;font-family:'Outfit',sans-serif;}
.bni.on{color:var(--accent2);}
.bni-ic{font-size:var(--bni-ic);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet,.modal,.settings-modal{background:var(--bg1);border-radius:16px 16px 0 0;width:100%;max-width:600px;padding:16px 20px 36px;max-height:90vh;overflow-y:auto;}
.handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.sheet-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--bg3);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sheet-av-lg{width:64px;height:64px;border-radius:50%;overflow:hidden;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;}
.sheet-av-lg img{width:100%;height:100%;object-fit:cover;}
.s-name{font-family:'DM Serif Display',serif;font-size:20px;text-align:center;margin-bottom:4px;}
.s-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px;}
.d-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.d-row:last-of-type{border-bottom:none;}
.d-ic{font-size:16px;width:24px;text-align:center;}.d-val{font-size:14px;color:var(--text1);}
.sheet-edit{width:100%;margin-top:16px;padding:12px;background:rgba(124,110,250,.15);border:1px solid rgba(124,110,250,.3);border-radius:10px;color:var(--accent2);font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;}
.sheet-del{width:100%;margin-top:8px;padding:12px;background:rgba(224,74,74,.12);border:1px solid rgba(224,74,74,.25);border-radius:10px;color:#F09595;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;}
.modal-title,.settings-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:18px;}
.fg{margin-bottom:14px;}
.fl{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.8px;margin-bottom:6px;display:block;}
.fi{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;font-size:14px;color:var(--text0);font-family:'Outfit',sans-serif;outline:none;}
.fi:focus{border-color:var(--accent);}
.mpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.mpick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border-radius:10px;border:1.5px solid var(--border2);background:transparent;cursor:pointer;font-size:11px;color:var(--text2);font-family:'Outfit',sans-serif;}
.mpick-btn.on{border-width:2px;}
.mpick-av{width:34px;height:34px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;}
.mpick-av img{width:100%;height:100%;object-fit:cover;}
.color-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.cp-btn{width:28px;height:28px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.cp-btn.on{border-color:#fff;transform:scale(1.2);}
.cp-none{width:28px;height:28px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2);flex-shrink:0;}
.cp-none.on{border-color:var(--accent);color:var(--accent);}
.form-acts{display:flex;gap:8px;margin-top:20px;}
.btn-cancel{flex:1;padding:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-save{flex:2;padding:12px;background:var(--accent);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-save:active{opacity:.8;}
.ms-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.ms-row:last-child{border-bottom:none;}
.ms-av-wrap{position:relative;cursor:pointer;flex-shrink:0;}
.ms-av{width:44px;height:44px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;}
.ms-av img{width:100%;height:100%;object-fit:cover;}
.ms-badge{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;border:1.5px solid var(--bg1);}
.ms-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--text0);font-family:'Outfit',sans-serif;outline:none;}
.ms-input:focus{border-color:var(--accent);}
.settings-save{width:100%;margin-top:20px;padding:13px;background:var(--accent);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;}
.loading-screen{position:fixed;inset:0;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:16px;}
.loading-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--text0);}
.loading-sub{font-size:13px;color:var(--text2);}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease;}
@media(max-width:375px){
  :root{--cal-margin:8px;--cell-h:52px;--hdr-pad:10px 12px 8px;--font-month:15px;--font-title:14px;--font-ev:13px;--font-meta:10px;--av-ev:30px;--bni-ic:18px;}
  .pin-grid{width:220px;}.pin-key{height:58px;font-size:20px;}.month-lbl{min-width:90px;}
  .bnav{padding-top:4px;padding-bottom:max(10px,env(safe-area-inset-bottom));}
}
@media(min-width:431px){
  :root{--cal-margin:16px;--cell-h:74px;--hdr-pad:16px 22px 12px;--font-month:19px;--font-title:18px;--font-ev:15px;--font-meta:12px;--av-ev:42px;--bni-ic:22px;}
  .pin-grid{width:300px;}.pin-key{height:80px;font-size:28px;}.month-lbl{min-width:130px;}
  .app-badge{width:34px;height:34px;}.nav-btn{width:34px;height:34px;}.dn{font-size:16px;width:28px;height:28px;}
  .add-btn{font-size:13px;padding:8px 14px;}
  .bnav{padding-top:8px;padding-bottom:max(16px,env(safe-area-inset-bottom));}
}
@media(min-width:601px){
  body{max-width:100%;padding-bottom:0;}
  .ipad-only{display:flex !important;}
  #appRoot{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;}
  .hdr{grid-column:1/-1;grid-row:1;}
  .cal-wrap{grid-column:1;grid-row:2;margin:16px 8px 16px 16px;align-self:start;overflow-y:auto;}
  .day-panel{grid-column:2;grid-row:2;margin:16px 16px 16px 8px;overflow-y:auto;}
  .toast{grid-column:1/-1;}.bnav{display:none;}
  :root{--cell-h:80px;--font-month:20px;--font-title:18px;--font-ev:15px;--font-meta:12px;--av-ev:44px;}
  .dn{font-size:16px;width:30px;height:30px;}.dow-cell{font-size:13px;padding:10px 2px;}
  .sheet,.modal,.settings-modal{max-width:520px;}
  .pin-grid{width:320px;}.pin-key{height:86px;font-size:30px;}
}
@media(max-height:500px) and (orientation:landscape){
  body{max-width:100%;padding-bottom:0;}
  .ipad-only{display:flex !important;}
  #appRoot{display:grid;grid-template-columns:64px 1fr 1fr;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;}
  .hdr{grid-column:2/-1;grid-row:1;padding:8px 14px 6px;}
  .cal-wrap{grid-column:2;grid-row:2;margin:8px 6px 8px 8px;overflow-y:auto;align-self:start;}
  .day-panel{grid-column:3;grid-row:2;margin:8px 8px 8px 6px;overflow-y:auto;}
  .toast{grid-column:2/-1;}
  .bnav{grid-column:1;grid-row:1/3;flex-direction:column;justify-content:center;width:64px;height:100vh;border-top:none;border-right:1px solid var(--border);position:static;transform:none;left:auto;padding:12px 0;padding-bottom:max(12px,env(safe-area-inset-bottom));}
  .bni{font-size:9px;padding:10px 4px;}.bni-ic{font-size:22px;}
  :root{--cell-h:48px;--font-month:14px;--font-title:13px;--font-ev:12px;--font-meta:10px;--av-ev:28px;}
  .dn{font-size:12px;width:20px;height:20px;}.dow-cell{font-size:9px;padding:5px 1px;}
  .month-lbl{min-width:80px;font-size:14px;}.nav-btn{width:26px;height:26px;font-size:14px;}
  .app-badge{width:24px;height:24px;font-size:12px;}.app-name{font-size:14px;}
  .av-sm{width:12px;height:12px;font-size:7px;}
  .week-day{min-height:80px;}
}
</style>
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-logo">🏠 家族カレンダー</div>
  <div class="pin-sub">4桁のPINを入力してください</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-grid" id="pinGrid">
    <div class="pin-key" onclick="pinInput('1')">1</div><div class="pin-key" onclick="pinInput('2')">2</div><div class="pin-key" onclick="pinInput('3')">3</div>
    <div class="pin-key" onclick="pinInput('4')">4</div><div class="pin-key" onclick="pinInput('5')">5</div><div class="pin-key" onclick="pinInput('6')">6</div>
    <div class="pin-key" onclick="pinInput('7')">7</div><div class="pin-key" onclick="pinInput('8')">8</div><div class="pin-key" onclick="pinInput('9')">9</div>
    <div class="pin-key empty"></div><div class="pin-key" onclick="pinInput('0')">0</div><div class="pin-key del" onclick="pinDel()">⌫</div>

const CORRECT_PIN='1209';const MAX_TRIES=3;const LOCK_MS=10*60*1000;
let pinValue='';
let pinTries=parseInt(localStorage.getItem('pinTries')||'0');
let lockUntil=parseInt(localStorage.getItem('lockUntil')||'0');
let lockTimer=null;

function checkLock(){
  const now=Date.now();
  if(lockUntil>now){showLocked();return true;}
  if(lockUntil>0&&lockUntil<=now){localStorage.removeItem('lockUntil');localStorage.setItem('pinTries','0');pinTries=0;lockUntil=0;}
  return false;
}
function showLocked(){
  const pg=document.getElementById('pinGrid');if(pg){pg.style.opacity='0.3';pg.style.pointerEvents='none';}
  document.getElementById('pinDots').style.display='none';
  const tick=()=>{
    const r=Math.ceil((lockUntil-Date.now())/1000);
    if(r<=0){clearInterval(lockTimer);localStorage.removeItem('lockUntil');localStorage.setItem('pinTries','0');pinTries=0;lockUntil=0;
      if(pg){pg.style.opacity='';pg.style.pointerEvents='';}
      document.getElementById('pinDots').style.display='flex';document.getElementById('pinError').innerHTML='';return;}
    const m=Math.floor(r/60),s=r%60;
    document.getElementById('pinError').innerHTML=`<div class="pin-locked">3回間違えました<br>ロック解除まで</div><div class="pin-timer">${m}:${s.toString().padStart(2,'0')}</div>`;
  };
  tick();if(lockTimer)clearInterval(lockTimer);lockTimer=setInterval(tick,1000);
}
function pinInput(d){if(checkLock())return;if(pinValue.length>=4)return;pinValue+=d;updatePinDots();if(pinValue.length===4)setTimeout(checkPin,100);}
function pinDel(){if(checkLock())return;pinValue=pinValue.slice(0,-1);updatePinDots();}
function updatePinDots(state){for(let i=0;i<4;i++){const dot=document.getElementById('pd'+i);dot.className='pin-dot'+(i<pinValue.length?' filled':'')+(state?' '+state:'');}}
function checkPin(){
  if(pinValue===CORRECT_PIN){
    updatePinDots('');localStorage.setItem('pinTries','0');pinTries=0;
    document.getElementById('pinScreen').style.display='none';
    document.getElementById('loadingScreen').style.display='flex';
    loadAll();
  }else{
    pinTries++;localStorage.setItem('pinTries',pinTries);updatePinDots('error');
    const dots=document.getElementById('pinDots');dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');
    if(pinTries>=MAX_TRIES){lockUntil=Date.now()+LOCK_MS;localStorage.setItem('lockUntil',lockUntil);setTimeout(()=>{pinValue='';updatePinDots();showLocked();},500);}
    else{document.getElementById('pinError').textContent=`PINが違います（あと${MAX_TRIES-pinTries}回）`;setTimeout(()=>{pinValue='';updatePinDots();},500);}
  }
}
function lockApp(){document.getElementById('appRoot').style.display='none';document.getElementById('pinScreen').style.display='flex';pinValue='';updatePinDots();document.getElementById('pinError').textContent='';}

async function loadAll(){
  setSyncDot('loading');
  try{
    const [evData,memData]=await Promise.all([sbGet('events','order=date.asc'),sbGet('members','order=id.asc')]);
    events=evData.map(e=>({...e,m:e.members}));
    if(memData.length===4)members=memData.map(m=>({id:m.id,name:m.name,color:m.color,img:m.img||null}));
    setSyncDot('ok');checkNewBadge();
  }catch(e){setSyncDot('err');showToast('接続エラー。オフラインで動作中');}
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appRoot').style.display='';
  renderChips();render();startAutoRefresh();
}
async function refreshEvents(){
  try{
    setSyncDot('loading');
    const prev=events.length;
    const evData=await sbGet('events','order=date.asc');
    events=evData.map(e=>({...e,m:e.members}));
    setSyncDot('ok');
    if(events.length>prev)checkNewBadge();
    render();
  }catch(e){setSyncDot('err');}
}
function checkNewBadge(){
  if(events.length>lastSeenCount)document.getElementById('badgeDot').classList.add('show');
}
function clearBadge(){
  lastSeenCount=events.length;localStorage.setItem('lastSeenCount',lastSeenCount);

}

function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`;}

function renderMonth(){
  const y=curMonth.getFullYear(),mo=curMonth.getMonth();
  document.getElementById('monthLbl').textContent=`${y}年${mo+1}月`;
  const grid=document.getElementById('calGrid');grid.className='cal-grid';grid.innerHTML='';
  const first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  const tod=fd(new Date()),sel=fd(selDate);
  const start=first.getDay();const total=Math.ceil((start+last.getDate())/7)*7;
  for(let i=0;i<total;i++){
    const d=new Date(y,mo,1+(i-start));const ds=fd(d);
    const isThis=d.getMonth()===mo;const dow=d.getDay();
    const hday=getHoliday(ds);const isHol=!!hday;
    const cell=document.createElement('div');
    cell.className='day'+(ds===tod?' tod':'')+(ds===sel?' sel':'')+(dow===0||isHol?' sun':dow===6?' sat':'')+(!isThis?' other':'');
    if(isHol&&isThis)cell.style.background='rgba(244,114,114,0.08)';
    cell.onclick=()=>selDay(d);
    const dn=document.createElement('div');dn.className='dn';dn.textContent=d.getDate();cell.appendChild(dn);
    if(hday&&isThis){const hl=document.createElement('div');hl.style.cssText='font-size:8px;color:#F47272;text-align:center;line-height:1.1;padding:0 1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-bottom:1px;';hl.textContent=hday;cell.appendChild(hl);}
    const dayEvs=events.filter(e=>e.date===ds&&evVis(e));

        const mi=(e.m||[])[0]||0;const av=avEl(mi,14);av.className='av-sm';

      cell.appendChild(row);
    }
    grid.appendChild(cell);
  }

    const hday=getHoliday(ds);const isHol=!!hday;
    const cell=document.createElement('div');cell.className='week-day';
    if(isHol)cell.style.background='rgba(244,114,114,0.06)';

function renderDay(){
  const ds=fd(selDate),tod=fd(new Date());
  const jp=selDate.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  const hday=getHoliday(ds);
  document.getElementById('dpTitle').textContent=ds===tod?`今日 ${jp}`:jp;
  const list=document.getElementById('evList');
  const dayEvs=events.filter(e=>e.date===ds&&evVis(e)).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
  if(!dayEvs.length&&!hday){list.innerHTML='<div class="empty">予定はありません<br>＋ボタンで追加できます</div>';return;}
  list.innerHTML='';
  if(hday){
    const hi=document.createElement('div');
    hi.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);';
    hi.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:rgba(244,114,114,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">🎌</div><div><div style="font-size:14px;font-weight:500;color:#F47272;">${hday}</div><div style="font-size:11px;color:var(--text2);">祝日・休日</div></div>`;
    list.appendChild(hi);
  }
  if(!dayEvs.length){const emp=document.createElement('div');emp.className='empty';emp.textContent='予定はありません';list.appendChild(emp);return;}
  dayEvs.forEach(e=>{
    const mi=(e.m||[])[0]||0;
    const lc=e.label_color||null;
    const avSize=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--av-ev'))||36;
    const item=document.createElement('div');item.className='ev-item';
    if(lc)item.style.borderLeftColor=lc;
    const av=avEl(mi,avSize);av.className='ev-av';av.style.background=members[mi]?.color+'22';
    const info=document.createElement('div');info.className='ev-info';
    info.innerHTML=`<div class="ev-title">${e.title}</div><div class="ev-meta"><span>${e.time||'終日'}</span><span>${(e.m||[]).map(i=>members[i]?.name||'').join('・')}</span>${lc?`<span class="ev-label-dot" style="background:${lc}"></span>`:''}${e.note?`<span>${e.note}</span>`:''}</div>`;
    const acts=document.createElement('div');acts.className='ev-actions';
    const eb=document.createElement('button');eb.className='ev-edit';eb.textContent='✏';eb.onclick=ev=>{ev.stopPropagation();openEdit(e.id);};
    const db=document.createElement('button');db.className='ev-del';db.textContent='✕';db.onclick=ev=>{ev.stopPropagation();delEv(e.id);};
    acts.appendChild(eb);acts.appendChild(db);
    item.appendChild(av);item.appendChild(info);item.appendChild(acts);
    item.onclick=()=>openDetail(e.id);
    list.appendChild(item);
  });
}

function openDetail(id){
  const e=events.find(x=>x.id===id);if(!e)return;
  const mi=(e.m||[])[0]||0;const m=members[mi];const lc=e.label_color;
  const dAv=document.getElementById('dAv');dAv.innerHTML='';
  dAv.style.background=lc?lc+'33':m.color+'33';
  dAv.style.outline=lc?`3px solid ${lc}`:'none';
  if(m.img){const img=document.createElement('img');img.src=m.img;img.style.cssText='width:100%;height:100%;object-fit:cover;';dAv.appendChild(img);}
  else{dAv.style.fontSize='28px';dAv.textContent=ICONS[mi];}
  document.getElementById('dName').textContent=e.title;
  document.getElementById('dSub').textContent=(e.m||[]).map(i=>members[i]?.name||'').join(' ・ ');
  const rows=[
    {ic:'📅',val:new Date(e.date+'T00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})},
    e.time?{ic:'🕐',val:e.time}:null,
    e.note?{ic:'📍',val:e.note}:null,
    lc?{ic:'🏷️',val:'カラーラベル設定済み'}:null,
  ].filter(Boolean);
  document.getElementById('dRows').innerHTML=rows.map(r=>`<div class="d-row"><span class="d-ic">${r.ic}</span><span class="d-val">${r.val}</span></div>`).join('');
  document.getElementById('dEdit').onclick=()=>{closeOv('detailOv');openEdit(id);};
  document.getElementById('dDel').onclick=()=>{delEv(id);closeOv('detailOv');};
  openOv('detailOv');
}
async function delEv(id){
  events=events.filter(e=>e.id!==id);render();
  try{setSyncDot('loading');await sbDelete('events',id);setSyncDot('ok');showToast('予定を削除しました');}
  catch(e){setSyncDot('err');showToast('削除に失敗しました');}
}

function renderColorPick(){
  const c=document.getElementById('colorPick');c.innerHTML='';
  LABEL_COLORS.forEach(col=>{
    const b=document.createElement('div');b.className='cp-btn'+(selColor===col?' on':'');
    b.style.background=col;b.onclick=()=>{selColor=col;renderColorPick();};
    c.appendChild(b);
  });
  const none=document.createElement('div');none.className='cp-none'+(selColor===null?' on':'');
  none.textContent='なし';none.onclick=()=>{selColor=null;renderColorPick();};
  c.appendChild(none);
}

function openAdd(){
  editingId=null;selMem=new Set();selColor=LABEL_COLORS[0];
  document.getElementById('addModalTitle').textContent='予定を追加';
  document.getElementById('eTitle').value='';document.getElementById('eDate').value=fd(selDate);
  document.getElementById('eTime').value='';document.getElementById('eNote').value='';
  renderMPick();renderColorPick();openOv('addOv');
  setTimeout(()=>document.getElementById('eTitle').focus(),350);
}
function openEdit(id){
  const e=events.find(x=>x.id===id);if(!e)return;
  editingId=id;selMem=new Set(e.m||[]);selColor=e.label_color||null;
  document.getElementById('addModalTitle').textContent='予定を編集';
  document.getElementById('eTitle').value=e.title;document.getElementById('eDate').value=e.date;
  document.getElementById('eTime').value=e.time||'';document.getElementById('eNote').value=e.note||'';
  renderMPick();renderColorPick();openOv('addOv');
}
function renderMPick(){
  const c=document.getElementById('mpick');c.innerHTML='';
  members.forEach((m,i)=>{
    const b=document.createElement('div');b.className='mpick-btn'+(selMem.has(i)?' on':'');b.style.borderColor=selMem.has(i)?m.color:'';
    const av=document.createElement('div');av.className='mpick-av';av.style.background=m.color+'22';
    if(m.img){const img=document.createElement('img');img.src=m.img;img.style.cssText='width:100%;height:100%;object-fit:cover;';av.appendChild(img);}
    else{av.style.fontSize='16px';av.textContent=ICONS[i];}
    const nm=document.createElement('span');nm.style.color=selMem.has(i)?m.color:'var(--text2)';nm.textContent=m.name;
    b.appendChild(av);b.appendChild(nm);b.onclick=()=>{selMem.has(i)?selMem.delete(i):selMem.add(i);renderMPick();};
    c.appendChild(b);
  });
}
async function saveEv(){
  const title=document.getElementById('eTitle').value.trim();
  const date=document.getElementById('eDate').value;
  const time=document.getElementById('eTime').value;
  const note=document.getElementById('eNote').value.trim();
  if(!title){showToast('タイトルを入力してください');return;}
  if(!date){showToast('日付を選択してください');return;}
  if(!selMem.size){showToast('誰の予定か選んでください');return;}
  closeOv('addOv');
  const payload={title,date,time:time||null,note:note||null,members:[...selMem],label_color:selColor||null};
  setSyncDot('loading');
  try{
    if(editingId){
      const saved=await sbUpdate('events',editingId,payload);
      const idx=events.findIndex(e=>e.id===editingId);
      if(idx>=0)events[idx]={...events[idx],...saved[0],m:saved[0].members};
      showToast('予定を更新しました ✓');
    }else{
      const saved=await sbInsert('events',payload);
      events.push({...saved[0],m:saved[0].members});
      showToast('予定を追加しました ✓');
    }
    selDate=new Date(date+'T00:00:00');
    if(viewMode==='month')curMonth=new Date(selDate.getFullYear(),selDate.getMonth(),1);
    else curWeekStart=getWeekStart(selDate);
    render();setSyncDot('ok');
  }catch(e){setSyncDot('err');showToast('保存に失敗しました');}
}

function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
function closeOvOut(id,e){if(e.target.id===id)closeOv(id);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

let bgImage=localStorage.getItem('bgImage')||null;
function applyBg(){
  if(bgImage){
    document.body.style.cssText+=`;background-image:url(${bgImage});background-size:cover;background-position:center;background-attachment:fixed;`;
    document.querySelectorAll('.hdr,.bnav').forEach(el=>el.style.background='rgba(13,15,20,.88)');
    document.querySelectorAll('.cal-wrap,.day-panel').forEach(el=>el.style.background='rgba(20,23,32,.82)');
    document.querySelectorAll('.sheet,.modal,.settings-modal').forEach(el=>el.style.background='rgba(20,23,32,.96)');
    document.getElementById('pinScreen').style.background='rgba(13,15,20,.95)';
  }else{
    document.body.style.backgroundImage='';
    document.querySelectorAll('.hdr,.bnav,.cal-wrap,.day-panel,.sheet,.modal,.settings-modal').forEach(el=>el.style.background='');
    document.getElementById('pinScreen').style.background='';
  }
}
function handleBgUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{bgImage=e.target.result;localStorage.setItem('bgImage',bgImage);updateBgPreview();applyBg();showToast('背景を設定しました ✓');};
  reader.readAsDataURL(file);
}
function clearBg(){bgImage=null;localStorage.removeItem('bgImage');updateBgPreview();applyBg();showToast('背景を削除しました');}
function updateBgPreview(){
  const p=document.getElementById('bgPreview');if(!p)return;
  p.innerHTML=bgImage?`<img src="${bgImage}" style="width:100%;height:100%;object-fit:cover;">`:' 🖼️';
}
function openSettings(){
  const c=document.getElementById('memberSettings');c.innerHTML='';
  members.forEach((m,i)=>{
    const row=document.createElement('div');row.className='ms-row';
    const wrap=document.createElement('div');wrap.className='ms-av-wrap';wrap.onclick=()=>document.getElementById('msFile'+i).click();
    const av=document.createElement('div');av.className='ms-av';av.id='msAv'+i;av.style.background=m.color+'33';
    if(m.img){const img=document.createElement('img');img.src=m.img;img.style.cssText='width:100%;height:100%;object-fit:cover;';av.appendChild(img);}
    else{av.style.fontSize='20px';av.textContent=ICONS[i];}
    const badge=document.createElement('div');badge.className='ms-badge';badge.textContent='✏';
    const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.style.display='none';fi.id='msFile'+i;
    fi.onchange=function(){
      const file=this.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{members[i].img=ev.target.result;const a=document.getElementById('msAv'+i);a.innerHTML='';const img=document.createElement('img');img.src=ev.target.result;img.style.cssText='width:100%;height:100%;object-fit:cover;';a.appendChild(img);};
      reader.readAsDataURL(file);
    };
    wrap.appendChild(av);wrap.appendChild(badge);wrap.appendChild(fi);
    const input=document.createElement('input');input.className='ms-input';input.value=m.name;input.maxLength=8;input.id='msName'+i;
    row.appendChild(wrap);row.appendChild(input);c.appendChild(row);
  });
  updateBgPreview();openOv('settingsOv');
}
async function saveSettings(){
  members.forEach((m,i)=>{const v=document.getElementById('msName'+i).value.trim();if(v)m.name=v;});
  closeOv('settingsOv');setSyncDot('loading');
  try{
    await Promise.all(members.map(m=>sbUpdate('members',m.id,{name:m.name,img:m.img})));
    setSyncDot('ok');renderChips();render();showToast('設定を保存しました ✓');
  }catch(e){setSyncDot('err');showToast('設定の保存に失敗しました');}
}

applyBg();checkLock();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.getElementById('appRoot').style.display!=='none')refreshEvents();});
</script>
