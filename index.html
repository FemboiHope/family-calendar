<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0F14">
<title>家族カレンダー</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg0:#0D0F14;--bg1:#141720;--bg2:#1C2030;--bg3:#252A3A;
  --border:#2E3448;--border2:#3A4060;
  --accent:#7C6EFA;--accent2:#9D92FB;
  --text0:#F0F2FF;--text1:#BEC5DC;--text2:#6B748E;--text3:#3D4460;
  --r:10px;
}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--text0);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:72px;}
.serif{font-family:'DM Serif Display',serif;}

/* ── PIN Screen ── */
.pin-screen{
  position:fixed;inset:0;background:var(--bg0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:300;gap:0;
}
.pin-logo{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text0);margin-bottom:6px;}
.pin-sub{font-size:13px;color:var(--text2);margin-bottom:40px;}
.pin-dots{display:flex;gap:16px;margin-bottom:36px;}
.pin-dot{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--border2);
  background:transparent;
  transition:all .15s;
}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-dot.error{background:#F47272;border-color:#F47272;}
.pin-error{font-size:13px;color:#F47272;margin-bottom:16px;min-height:20px;text-align:center;}
.pin-locked{font-size:13px;color:#F47272;text-align:center;padding:0 24px;line-height:1.6;}
.pin-timer{font-size:22px;font-weight:700;color:#F47272;margin-top:8px;}

.pin-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;width:260px;
}
.pin-key{
  height:70px;border-radius:16px;
  background:var(--bg2);border:1px solid var(--border);
  font-size:24px;font-weight:500;color:var(--text0);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .1s;font-family:'Outfit',sans-serif;
  user-select:none;
}
.pin-key:active{background:var(--bg3);transform:scale(.95);}
.pin-key.del{font-size:18px;color:var(--text2);}
.pin-key.empty{background:transparent;border:none;cursor:default;}
.pin-key.empty:active{transform:none;}

/* ── App ── */
.hdr{background:var(--bg1);padding:14px 18px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.app-name{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
.app-badge{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);margin-left:4px;transition:background .3s;}
.sync-dot.ok{background:#34D399;}.sync-dot.err{background:#F47272;}.sync-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.lock-btn{width:30px;height:30px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.lock-btn:active{background:var(--bg3);}
.month-nav{display:flex;align-items:center;gap:8px;}
.month-lbl{font-family:'DM Serif Display',serif;font-size:17px;min-width:110px;text-align:center;}
.nav-btn{width:30px;height:30px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text1);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-btn:active{background:var(--bg3);}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;}
.chips::-webkit-scrollbar{display:none;}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);white-space:nowrap;font-family:'Outfit',sans-serif;}
.chip.on{border-color:currentColor;color:inherit;}
.chip-av{width:18px;height:18px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;}
.chip-av img{width:100%;height:100%;object-fit:cover;}
.cal-wrap{background:var(--bg1);margin:12px 14px 0;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2);border-bottom:1px solid var(--border);}
.dow-cell{text-align:center;padding:7px 2px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;}
.dow-cell:first-child{color:#F47272;}.dow-cell:last-child{color:#6090D0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day{min-height:62px;padding:4px 3px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.day:nth-child(7n){border-right:none;}.day:active{background:var(--bg3);}
.day.other .dn{color:var(--text3);}.day.sel{background:var(--bg3);}
.day.sel .dn{background:var(--accent);color:#fff;border-radius:50%;}
.day.tod .dn{background:rgba(124,110,250,.22);color:var(--accent2);border-radius:50%;}
.day.tod.sel .dn{background:var(--accent);color:#fff;}
.dn{font-family:'DM Serif Display',serif;font-size:14px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:0 auto 3px;color:var(--text1);}
.day.sun .dn{color:#F47272;}.day.sat .dn{color:#6090D0;}
.av-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:0 2px;}
.av-sm{width:16px;height:16px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;}
.av-sm img{width:100%;height:100%;object-fit:cover;}
.more-dot{width:16px;height:16px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text2);font-weight:600;}
.day-panel{background:var(--bg1);margin:12px 14px 0;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;}
.dp-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.dp-title{font-family:'DM Serif Display',serif;font-size:16px;}
.add-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--accent);border:none;border-radius:8px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;}
.add-btn:active{opacity:.8;}
.ev-list{padding:6px 0;min-height:56px;}
.ev-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;}
.ev-item:active{background:var(--bg2);}
.ev-av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ev-av img{width:100%;height:100%;object-fit:cover;}
.ev-info{flex:1;min-width:0;}
.ev-title{font-size:14px;font-weight:500;margin-bottom:2px;}
.ev-meta{font-size:11px;color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;}
.ev-del{padding:6px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;border-radius:6px;}
.ev-del:active{background:#3A1A1A;color:#F09595;}
.empty{padding:22px;text-align:center;font-size:13px;color:var(--text3);}
.toast{background:var(--bg3);border:1px solid var(--border2);color:var(--text0);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;text-align:center;margin:8px 14px 0;pointer-events:none;}
.toast.show{opacity:1;}
.bnav{background:var(--bg1);border-top:1px solid var(--border);display:flex;padding:6px 0 12px;position:sticky;bottom:0;}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;border:none;background:none;font-family:'Outfit',sans-serif;}
.bni.on{color:var(--accent2);}.bni-ic{font-size:20px;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet,.modal,.settings-modal{background:var(--bg1);border-radius:16px 16px 0 0;width:100%;max-width:430px;padding:16px 20px 36px;max-height:90vh;overflow-y:auto;}
.handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.sheet-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--bg3);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sheet-av-lg{width:64px;height:64px;border-radius:50%;overflow:hidden;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;}
.sheet-av-lg img{width:100%;height:100%;object-fit:cover;}
.s-name{font-family:'DM Serif Display',serif;font-size:20px;text-align:center;margin-bottom:4px;}
.s-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px;}
.d-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.d-row:last-of-type{border-bottom:none;}
.d-ic{font-size:16px;width:24px;text-align:center;}.d-val{font-size:14px;color:var(--text1);}
.sheet-del{width:100%;margin-top:16px;padding:12px;background:rgba(224,74,74,.12);border:1px solid rgba(224,74,74,.25);border-radius:10px;color:#F09595;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;}
.sheet-del:active{background:rgba(224,74,74,.2);}
.modal-title,.settings-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:18px;}
.fg{margin-bottom:14px;}
.fl{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.8px;margin-bottom:5px;display:block;}
.fi{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;font-size:14px;color:var(--text0);font-family:'Outfit',sans-serif;outline:none;}
.fi:focus{border-color:var(--accent);}
.mpick{display:flex;gap:8px;}
.mpick-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--border2);background:transparent;cursor:pointer;font-size:11px;color:var(--text2);font-family:'Outfit',sans-serif;}
.mpick-btn.on{border-width:2px;}
.mpick-av{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;}
.mpick-av img{width:100%;height:100%;object-fit:cover;}
.form-acts{display:flex;gap:8px;margin-top:20px;}
.btn-cancel{flex:1;padding:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-save{flex:2;padding:12px;background:var(--accent);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-save:active{opacity:.8;}
.ms-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.ms-row:last-child{border-bottom:none;}
.ms-av-wrap{position:relative;cursor:pointer;flex-shrink:0;}
.ms-av{width:44px;height:44px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;}
.ms-av img{width:100%;height:100%;object-fit:cover;}
.ms-badge{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;border:1.5px solid var(--bg1);}
.ms-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--text0);font-family:'Outfit',sans-serif;outline:none;}
.ms-input:focus{border-color:var(--accent);}
.settings-save{width:100%;margin-top:20px;padding:13px;background:var(--accent);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;}
.loading-screen{position:fixed;inset:0;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:16px;}
.loading-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--text0);}
.loading-sub{font-size:13px;color:var(--text2);}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease;}
</style>
</head>
<body>

<!-- PIN Screen -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-logo">🏠 家族カレンダー</div>
  <div class="pin-sub">4桁のPINを入力してください</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="pd0"></div>
    <div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-grid" id="pinGrid">
    <div class="pin-key" onclick="pinInput('1')">1</div>
    <div class="pin-key" onclick="pinInput('2')">2</div>
    <div class="pin-key" onclick="pinInput('3')">3</div>
    <div class="pin-key" onclick="pinInput('4')">4</div>
    <div class="pin-key" onclick="pinInput('5')">5</div>
    <div class="pin-key" onclick="pinInput('6')">6</div>
    <div class="pin-key" onclick="pinInput('7')">7</div>
    <div class="pin-key" onclick="pinInput('8')">8</div>
    <div class="pin-key" onclick="pinInput('9')">9</div>
    <div class="pin-key empty"></div>
    <div class="pin-key" onclick="pinInput('0')">0</div>
    <div class="pin-key del" onclick="pinDel()">⌫</div>
  </div>
</div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen" style="display:none;">
  <div class="spinner"></div>
  <div class="loading-title">家族カレンダー</div>
  <div class="loading-sub">クラウドに接続中...</div>
</div>

<div id="appRoot" style="display:none;">
<div class="hdr">
  <div class="hdr-top">
    <div class="app-name">
      <div class="app-badge">🏠</div>
      <span class="serif">家族カレンダー</span>
      <div class="sync-dot" id="syncDot"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="lock-btn" onclick="lockApp()" title="ロック">🔒</div>
      <div class="month-nav">
        <button class="nav-btn" onclick="chMonth(-1)">‹</button>
        <div class="month-lbl" id="monthLbl"></div>
        <button class="nav-btn" onclick="chMonth(1)">›</button>
      </div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="cal-wrap">
  <div class="dow-row">
    <div class="dow-cell">日</div><div class="dow-cell">月</div>
    <div class="dow-cell">火</div><div class="dow-cell">水</div>
    <div class="dow-cell">木</div><div class="dow-cell">金</div>
    <div class="dow-cell">土</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="day-panel">
  <div class="dp-hdr">
    <div class="dp-title" id="dpTitle"></div>
    <button class="add-btn" onclick="openAdd()">＋ 追加</button>
  </div>
  <div class="ev-list" id="evList"></div>
</div>

<div class="toast" id="toast"></div>

<div class="bnav">
  <button class="bni on"><span class="bni-ic">📅</span>カレンダー</button>
  <button class="bni" onclick="showToast('近日公開予定')"><span class="bni-ic">📋</span>一覧</button>
  <button class="bni" onclick="showToast('近日公開予定')"><span class="bni-ic">🔔</span>通知</button>
  <button class="bni" onclick="openSettings()"><span class="bni-ic">⚙️</span>設定</button>
</div>
</div>

<!-- Detail overlay -->
<div class="ov" id="detailOv" onclick="closeOvOut('detailOv',event)">
  <div class="sheet" style="position:relative;">
    <div class="handle"></div>
    <button class="sheet-close" onclick="closeOv('detailOv')">✕</button>
    <div class="sheet-av-lg" id="dAv"></div>
    <div class="s-name" id="dName"></div>
    <div class="s-sub" id="dSub"></div>
    <div id="dRows"></div>
    <button class="sheet-del" id="dDel">この予定を削除</button>
  </div>
</div>

<!-- Add overlay -->
<div class="ov" id="addOv" onclick="closeOvOut('addOv',event)">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title">予定を追加</div>
    <div class="fg"><label class="fl">タイトル</label><input class="fi" id="eTitle" type="text" placeholder="例：病院、習い事..." maxlength="30"></div>
    <div class="fg"><label class="fl">日付</label><input class="fi" id="eDate" type="date"></div>
    <div class="fg"><label class="fl">時間（任意）</label><input class="fi" id="eTime" type="time"></div>
    <div class="fg"><label class="fl">メモ（任意）</label><input class="fi" id="eNote" placeholder="場所・詳細など" maxlength="40"></div>
    <div class="fg"><label class="fl">だれの予定？（複数OK）</label><div class="mpick" id="mpick"></div></div>
    <div class="form-acts">
      <button class="btn-cancel" onclick="closeOv('addOv')">キャンセル</button>
      <button class="btn-save" onclick="saveEv()">保存する</button>
    </div>
  </div>
</div>

<!-- Settings overlay -->
<div class="ov" id="settingsOv" onclick="closeOvOut('settingsOv',event)">
  <div class="settings-modal">
    <div class="handle"></div>
    <div class="settings-title">設定</div>
    <div style="font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.8px;margin-bottom:10px;">背景画像</div>
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:16px;">
      <div id="bgPreview" style="width:56px;height:56px;border-radius:10px;background:var(--bg2);border:1px solid var(--border2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;" onclick="document.getElementById('bgFileInput').click()">🖼️</div>
      <div style="flex:1;">
        <div style="font-size:13px;color:var(--text1);margin-bottom:6px;">背景に好きな写真を設定できます</div>
        <div style="display:flex;gap:8px;">
          <button onclick="document.getElementById('bgFileInput').click()" style="flex:1;padding:7px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;font-size:12px;font-weight:600;color:var(--accent2);cursor:pointer;font-family:'Outfit',sans-serif;">写真を選ぶ</button>
          <button onclick="clearBg()" style="padding:7px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;">削除</button>
        </div>
      </div>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none;" onchange="handleBgUpload(this)">
    </div>
    <div style="font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.8px;margin-bottom:10px;">メンバー</div>
    <div id="memberSettings"></div>
    <button class="settings-save" onclick="saveSettings()">保存する</button>
  </div>
</div>

  const now=Date.now();
  if(lockUntil>now){
    showLocked();
    return true;
  }
  if(lockUntil>0&&lockUntil<=now){
    localStorage.removeItem('lockUntil');
    localStorage.setItem('pinTries','0');
    pinTries=0;
    lockUntil=0;
  }
  return false;
}

function showLocked(){
  document.getElementById('pinGrid').style.opacity='0.3';
  document.getElementById('pinGrid').style.pointerEvents='none';
  document.getElementById('pinDots').style.display='none';
  document.getElementById('pinError').innerHTML='';
  const remaining=Math.ceil((lockUntil-Date.now())/1000);
  const mins=Math.floor(remaining/60);
  const secs=remaining%60;
  document.getElementById('pinError').innerHTML=
    `<div class="pin-locked">3回間違えました<br>ロック解除まで</div>
     <div class="pin-timer">${mins}:${secs.toString().padStart(2,'0')}</div>`;
  if(lockTimer)clearInterval(lockTimer);
  lockTimer=setInterval(()=>{
    const now=Date.now();
    if(now>=lockUntil){
      clearInterval(lockTimer);
      localStorage.removeItem('lockUntil');
      localStorage.setItem('pinTries','0');
      pinTries=0;lockUntil=0;
      document.getElementById('pinGrid').style.opacity='';
      document.getElementById('pinGrid').style.pointerEvents='';
      document.getElementById('pinDots').style.display='flex';
      document.getElementById('pinError').innerHTML='';
      return;
    }
    const r=Math.ceil((lockUntil-now)/1000);
    const m=Math.floor(r/60),s=r%60;
    document.getElementById('pinTimer');
    document.getElementById('pinError').innerHTML=
      `<div class="pin-locked">3回間違えました<br>ロック解除まで</div>
       <div class="pin-timer">${m}:${s.toString().padStart(2,'0')}</div>`;
  },1000);
}

function pinInput(d){
  if(checkLock())return;
  if(pinValue.length>=4)return;
  pinValue+=d;
  updatePinDots();
  if(pinValue.length===4)setTimeout(checkPin,100);
}
function pinDel(){
  if(checkLock())return;
  pinValue=pinValue.slice(0,-1);
  updatePinDots();
}
function updatePinDots(state){
  for(let i=0;i<4;i++){
    const dot=document.getElementById('pd'+i);
    dot.className='pin-dot'+(i<pinValue.length?' filled':'')+(state?' '+state:'');
  }
}
function checkPin(){
  if(pinValue===CORRECT_PIN){
    updatePinDots('');
    localStorage.setItem('pinTries','0');
    pinTries=0;
    document.getElementById('pinScreen').style.display='none';
    document.getElementById('loadingScreen').style.display='flex';
    loadAll();
  } else {
    pinTries++;
    localStorage.setItem('pinTries',pinTries);
    updatePinDots('error');
    const dots=document.getElementById('pinDots');
    dots.classList.remove('shake');
    void dots.offsetWidth;
    dots.classList.add('shake');
    if(pinTries>=MAX_TRIES){
      lockUntil=Date.now()+LOCK_MS;
      localStorage.setItem('lockUntil',lockUntil);
      setTimeout(()=>{pinValue='';updatePinDots();showLocked();},500);
    } else {
      document.getElementById('pinError').textContent=`PINが違います（あと${MAX_TRIES-pinTries}回）`;
      setTimeout(()=>{pinValue='';updatePinDots();},500);
    }
  }
}

function lockApp(){
  document.getElementById('appRoot').style.display='none';
  document.getElementById('pinScreen').style.display='flex';
  pinValue='';updatePinDots();
  document.getElementById('pinError').textContent='';
}

async function sbDelete(t,id){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:H});if(!r.ok)throw new Error(await r.text());}
async function sbUpdate(t,id,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}

function setSyncDot(s){const d=document.getElementById('syncDot');d.className='sync-dot'+(s?' '+s:'');}

async function loadAll(){
  setSyncDot('loading');
  try{
    const [evData,memData]=await Promise.all([sbGet('events','order=date.asc'),sbGet('members','order=id.asc')]);
    events=evData.map(e=>({...e,m:e.members}));
    if(memData.length===4)members=memData.map(m=>({id:m.id,name:m.name,color:m.color,img:m.img||null}));
    setSyncDot('ok');
  }catch(e){setSyncDot('err');showToast('接続エラー。オフラインで動作中');}
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appRoot').style.display='';
  renderChips();renderCal();renderDay();
  startAutoRefresh();
}

async function refreshEvents(){
  try{
    setSyncDot('loading');
    const evData=await sbGet('events','order=date.asc');
    events=evData.map(e=>({...e,m:e.members}));
    setSyncDot('ok');
    renderCal();renderDay();
  }catch(e){setSyncDot('err');}
}

let autoRefreshTimer=null;
function startAutoRefresh(){
  if(autoRefreshTimer)clearInterval(autoRefreshTimer);

    if(document.getElementById('appRoot').style.display!=='none'){

function getHoliday(ds){return HOLIDAYS[ds]||null;}

function avEl(mi,size){
  const m=members[mi]||members[0];const s=size||16;
  const d=document.createElement('div');
  d.style.cssText=`width:${s}px;height:${s}px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${m.color}33;font-size:${Math.round(s*.55)}px;`;

  else d.textContent=ICONS[mi];
  return d;

function renderChips(){
  const c=document.getElementById('chips');c.innerHTML='';
  members.forEach((m,i)=>{
    const d=document.createElement('div');d.className='chip'+(activeF.has(i)?' on':'');d.style.color=activeF.has(i)?m.color:'';

function toggleF(i){if(activeF.has(i)){if(activeF.size>1)activeF.delete(i);}else activeF.add(i);renderChips();renderCal();renderDay();}
function evVis(e){return(e.m||[]).some(i=>activeF.has(i));}

function renderCal(){
  const y=curMonth.getFullYear(),mo=curMonth.getMonth();
  document.getElementById('monthLbl').textContent=`${y}年${mo+1}月`;
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  const tod=fd(new Date()),sel=fd(selDate);
  const start=first.getDay();const total=Math.ceil((start+last.getDate())/7)*7;
  for(let i=0;i<total;i++){
    const d=new Date(y,mo,1+(i-start));const ds=fd(d);
    const isThis=d.getMonth()===mo;const dow=d.getDay();
    const cell=document.createElement('div');
    const hday=getHoliday(ds);
    const isHoliday=!!hday;
    cell.className='day'+(ds===tod?' tod':'')+(ds===sel?' sel':'')+(dow===0||isHoliday?' sun':dow===6?' sat':'')+(!isThis?' other':'')+(isHoliday?' holiday':'');
    if(isHoliday&&isThis)cell.style.background='rgba(244,114,114,0.08)';
    cell.onclick=()=>selDay(d);
    const dn=document.createElement('div');dn.className='dn';dn.textContent=d.getDate();cell.appendChild(dn);
    if(hday&&isThis){
      const hl=document.createElement('div');
      hl.style.cssText='font-size:8px;color:#F47272;text-align:center;line-height:1.1;padding:0 1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-bottom:1px;';
      hl.textContent=hday;cell.appendChild(hl);
    }
    const dayEvs=events.filter(e=>e.date===ds&&evVis(e));
    if(dayEvs.length){
      const row=document.createElement('div');row.className='av-row';
      dayEvs.slice(0,3).forEach(e=>{const mi=(e.m||[])[0]||0;const av=avEl(mi,16);av.className='av-sm';row.appendChild(av);});
      if(dayEvs.length>3){const more=document.createElement('div');more.className='more-dot';more.textContent='+'+(dayEvs.length-3);row.appendChild(more);}
      cell.appendChild(row);
    }
    grid.appendChild(cell);
  }
}
function selDay(d){selDate=d;if(d.getMonth()!==curMonth.getMonth())curMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCal();renderDay();}
function renderDay(){
  const ds=fd(selDate),tod=fd(new Date());
  const jp=selDate.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  const hday=getHoliday(ds);
  const titleBase=ds===tod?`今日 ${jp}`:jp;
  document.getElementById('dpTitle').textContent=titleBase;
  const list=document.getElementById('evList');
  const dayEvs=events.filter(e=>e.date===ds&&evVis(e)).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
  if(!dayEvs.length&&!hday){list.innerHTML='<div class="empty">予定はありません<br>＋ボタンで追加できます</div>';return;}
  list.innerHTML='';
  if(hday){
    const hitem=document.createElement('div');
    hitem.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);';
    hitem.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:rgba(244,114,114,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">🎌</div><div><div style="font-size:14px;font-weight:500;color:#F47272;">${hday}</div><div style="font-size:11px;color:var(--text2);">祝日・休日</div></div>`;
    list.appendChild(hitem);
  }
  if(!dayEvs.length){const emp=document.createElement('div');emp.className='empty';emp.textContent='予定はありません';list.appendChild(emp);return;}
  list.innerHTML='';
  dayEvs.forEach(e=>{
    const mi=(e.m||[])[0]||0;
    const item=document.createElement('div');item.className='ev-item';
    const av=avEl(mi,36);av.className='ev-av';av.style.background=members[mi].color+'22';
    const info=document.createElement('div');info.className='ev-info';
    info.innerHTML=`<div class="ev-title">${e.title}</div><div class="ev-meta"><span>${e.time||'終日'}</span><span>${(e.m||[]).map(i=>members[i]?.name||'').join('・')}</span>${e.note?`<span>${e.note}</span>`:''}</div>`;
    const del=document.createElement('button');del.className='ev-del';del.textContent='✕';del.onclick=ev=>{ev.stopPropagation();delEv(e.id);};
    item.appendChild(av);item.appendChild(info);item.appendChild(del);
    item.onclick=()=>openDetail(e.id);
    list.appendChild(item);
  });
}
function chMonth(dir){curMonth=new Date(curMonth.getFullYear(),curMonth.getMonth()+dir,1);renderCal();refreshEvents();}

function openDetail(id){
  const e=events.find(x=>x.id===id);if(!e)return;
  const mi=(e.m||[])[0]||0;const m=members[mi];
  const dAv=document.getElementById('dAv');dAv.innerHTML='';dAv.style.background=m.color+'33';
  if(m.img){const img=document.createElement('img');img.src=m.img;img.style.cssText='width:100%;height:100%;object-fit:cover;';dAv.appendChild(img);}
  else{dAv.style.fontSize='28px';dAv.textContent=ICONS[mi];}
  document.getElementById('dName').textContent=e.title;
  document.getElementById('dSub').textContent=(e.m||[]).map(i=>members[i]?.name||'').join(' ・ ');
  const rows=[
    {ic:'📅',val:new Date(e.date+'T00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})},
    e.time?{ic:'🕐',val:e.time}:null,e.note?{ic:'📍',val:e.note}:null,
  ].filter(Boolean);
  document.getElementById('dRows').innerHTML=rows.map(r=>`<div class="d-row"><span class="d-ic">${r.ic}</span><span class="d-val">${r.val}</span></div>`).join('');
  document.getElementById('dDel').onclick=()=>{delEv(id);closeOv('detailOv');};

async function delEv(id){

  try{setSyncDot('loading');await sbDelete('events',id);setSyncDot('ok');showToast('予定を削除しました');}
  catch(e){setSyncDot('err');showToast('削除に失敗しました');}

async function saveEv(){
  const title=document.getElementById('eTitle').value.trim();
  const date=document.getElementById('eDate').value;
  const time=document.getElementById('eTime').value;
  const note=document.getElementById('eNote').value.trim();
  if(!title){showToast('タイトルを入力してください');return;}
  if(!date){showToast('日付を選択してください');return;}
  if(!selMem.size){showToast('誰の予定か選んでください');return;}
  closeOv('addOv');
  const newEv={title,date,time:time||null,note:note||null,members:[...selMem]};
  setSyncDot('loading');
  try{
    const saved=await sbInsert('events',newEv);
    events.push({...saved[0],m:saved[0].members});
    selDate=new Date(date+'T00:00:00');curMonth=new Date(selDate.getFullYear(),selDate.getMonth(),1);
    renderCal();renderDay();setSyncDot('ok');showToast('予定を追加しました ✓');
  }catch(e){setSyncDot('err');showToast('保存に失敗しました');}
}
async function saveSettings(){
  members.forEach((m,i)=>{const v=document.getElementById('msName'+i).value.trim();if(v)m.name=v;});
  closeOv('settingsOv');setSyncDot('loading');
  try{
    await Promise.all(members.map(m=>sbUpdate('members',m.id,{name:m.name,img:m.img})));
    setSyncDot('ok');renderChips();renderCal();renderDay();showToast('設定を保存しました ✓');
  }catch(e){setSyncDot('err');showToast('設定の保存に失敗しました');}
}
function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
function closeOvOut(id,e){if(e.target.id===id)closeOv(id);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

let bgImage=localStorage.getItem('bgImage')||null;
function applyBg(){
  if(bgImage){
    document.body.style.backgroundImage=`url(${bgImage})`;
    document.body.style.backgroundSize='cover';
    document.body.style.backgroundPosition='center';
    document.body.style.backgroundAttachment='fixed';
    document.querySelectorAll('.hdr,.cal-wrap,.day-panel,.bnav,.day,.sheet,.modal,.settings-modal,.pin-screen').forEach(el=>{
      el.style.background=el.style.background||'';
    });
    document.querySelectorAll('.hdr,.bnav').forEach(el=>el.style.background='rgba(13,15,20,.88)');
    document.querySelectorAll('.cal-wrap,.day-panel').forEach(el=>el.style.background='rgba(20,23,32,.82)');
    document.querySelectorAll('.day').forEach(el=>el.style.background='transparent');
    document.querySelectorAll('.sheet,.modal,.settings-modal').forEach(el=>el.style.background='rgba(20,23,32,.96)');
    document.getElementById('pinScreen').style.background='rgba(13,15,20,.95)';
  } else {
    document.body.style.backgroundImage='';
    document.querySelectorAll('.hdr,.bnav,.cal-wrap,.day-panel,.sheet,.modal,.settings-modal').forEach(el=>el.style.background='');
    document.getElementById('pinScreen').style.background='';
  }
}
function handleBgUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    bgImage=e.target.result;
    localStorage.setItem('bgImage',bgImage);
    updateBgPreview();
    applyBg();
    showToast('背景を設定しました ✓');
  };
  reader.readAsDataURL(file);
}
function clearBg(){
  bgImage=null;
  localStorage.removeItem('bgImage');
  updateBgPreview();
  applyBg();
  showToast('背景を削除しました');
}
function updateBgPreview(){
  const p=document.getElementById('bgPreview');
  if(!p)return;
  if(bgImage){
    p.innerHTML=`<img src="${bgImage}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    p.innerHTML='🖼️';
  }
}
function openSettings(){
  const c=document.getElementById('memberSettings');c.innerHTML='';
  members.forEach((m,i)=>{
    const row=document.createElement('div');row.className='ms-row';
    const wrap=document.createElement('div');wrap.className='ms-av-wrap';wrap.onclick=()=>document.getElementById('msFile'+i).click();
    const av=document.createElement('div');av.className='ms-av';av.id='msAv'+i;av.style.background=m.color+'33';
    if(m.img){const img=document.createElement('img');img.src=m.img;img.style.cssText='width:100%;height:100%;object-fit:cover;';av.appendChild(img);}
    else{av.style.fontSize='20px';av.textContent=ICONS[i];}
    const badge=document.createElement('div');badge.className='ms-badge';badge.textContent='✏';
    const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';fileInput.style.display='none';fileInput.id='msFile'+i;
    fileInput.onchange=function(){
      const file=this.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        members[i].img=ev.target.result;
        const a=document.getElementById('msAv'+i);a.innerHTML='';
        const img=document.createElement('img');img.src=ev.target.result;img.style.cssText='width:100%;height:100%;object-fit:cover;';a.appendChild(img);
      };
      reader.readAsDataURL(file);
    };
    wrap.appendChild(av);wrap.appendChild(badge);wrap.appendChild(fileInput);
    const input=document.createElement('input');input.className='ms-input';input.value=m.name;input.maxLength=8;input.id='msName'+i;
    row.appendChild(wrap);row.appendChild(input);c.appendChild(row);
  });
  updateBgPreview();
  openOv('settingsOv');
}

applyBg();
checkLock();

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && document.getElementById('appRoot').style.display!=='none'){
    refreshEvents();
  }
});
